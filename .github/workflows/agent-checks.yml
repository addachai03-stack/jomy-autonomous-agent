name: Agent API checks

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit tests and Worker dry-run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate PWA JavaScript syntax
        run: node --check pwa/app.js
      - name: Validate voice and task utility module syntax
        run: node --check pwa/voice-utils.js && node --check pwa/task-engine.js && node --check pwa/task-planner.js && node --check src/task-planner.js
      - name: Validate MCP bridge JavaScript syntax
        run: node --check src/mcp-client.js && node --check src/worker.js
      - name: Validate PWA manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('pwa/manifest.json', 'utf8'))"
      - name: Run Worker API tests
        run: npm test
      - name: Validate Cloudflare Worker build
        run: npm run check:api
